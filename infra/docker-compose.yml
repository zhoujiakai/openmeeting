# Meeting System Backend 服务编排
# 包含: PostgreSQL, Redis, Backend API

services:
  # ============================================
  # PostgreSQL 数据库
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: meetingsystem-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=YourStrong@Passw0rd
      - POSTGRES_DB=meetingdb
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meetingsystem-network

  # ============================================
  # Redis 缓存
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: meetingsystem-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass YourRedis@Passw0rd
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "YourRedis@Passw0rd", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meetingsystem-network

  # ============================================
  # Backend API (可选 - Docker 构建)
  # ============================================
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: meetingsystem-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PostgreSqlConnectionString=Host=postgres;Port=5432;Database=meetingdb;Username=postgres;Password=YourStrong@Passw0rd
      - ConnectionStrings__RedisConnectionString=redis:6379,password=YourRedis@Passw0rd
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - meetingsystem-network
    profiles:
      - with-backend  # 使用 --profile with-backend 启动 backend

volumes:
  postgres-data:
  redis-data:

networks:
  meetingsystem-network:
    driver: bridge
